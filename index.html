<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Gym Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box}

body{margin:0;padding:24px 16px;background:#fff;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

.container{max-width:950px;margin:auto}

h1{font-size:25px;margin:0 0 8px}

.subtitle{color:#777;font-size:14px;margin:0 0 24px}

.panel{border:1px solid #e5e5e5;border-radius:12px;padding:20px;margin-bottom:22px}

input{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:7px;font-size:16px}

button{cursor:pointer}

.action{padding:11px 16px;border:0;border-radius:7px;background:#222;color:white;font-size:14px;margin:5px 5px 5px 0}

.secondary{background:#eee;color:#222}

#message{font-size:13px;color:#666;margin-top:12px}

#tracker{display:none}

.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}

#count{font-size:14px;color:#555}

.heatmap-wrap{overflow-x:auto;padding-bottom:8px}

.months,.heatmap{display:grid;grid-template-columns:30px repeat(53,13px);column-gap:3px;min-width:max-content}

.months{margin-bottom:8px;min-height:16px}

.months span{font-size:11px;color:#777;white-space:nowrap}

.heatmap{grid-template-rows:repeat(7,13px);row-gap:3px}

.weekday{font-size:10px;color:#888;align-self:center}

.day{width:13px;height:13px;padding:0;border:0;border-radius:3px;background:#ebedf0}

.day.done{background:#39a66a}

.day:focus{outline:2px solid #333;outline-offset:2px}

.legend{display:flex;align-items:center;gap:5px;font-size:11px;color:#777;margin-top:14px}

.legend .day{display:inline-block}

.small{font-size:12px;color:#888;margin-top:20px}

</style>

</head>

<body>

<div class="container">

<h1>My Gym Consistency</h1>

<p class="subtitle">One square for every day. Green means you trained. 💚</p>

<div id="auth" class="panel">

<h3>Sign in to your tracker</h3>

<p style="font-size:13px;color:#777">Use the same email and password on your iPad and iPhone.</p>

<input id="email" type="email" placeholder="Email address" autocomplete="email">

<input id="password" type="password" placeholder="Password" autocomplete="current-password">

<button class="action" id="signin" onclick="signIn()">Sign in</button>

<button class="action secondary" id="signup" onclick="signUp()">Create account</button>

<div id="message">New here? Create your account first.</div>

</div>

<div id="tracker">

<div class="topline">

<div id="count">0 workouts</div>

<button class="action secondary" onclick="signOut()">Sign out</button>

</div>

<div class="heatmap-wrap">

<div class="months" id="months"></div>

<div class="heatmap" id="heatmap"></div>

</div>

<div class="legend">

Less <span class="day"></span><span class="day done"></span> More

</div>

<p class="small">November 1, 2026 – October 31, 2027</p>

<p class="small" id="syncStatus">Connecting...</p>

</div>

</div>

<script>

const SUPABASE_URL = "sb_publishable_WEVYogtLNXtwKmGFv1uPnA_IcaHg";

const SUPABASE_KEY = "sb_publishable_WEVYogtLNXtwKmGFv1uPnA_IcaHgFay";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const start = new Date(Date.UTC(2026,10,1));

const end = new Date(Date.UTC(2027,9,31));

const dates = [];

for(let d=new Date(start);d<=end;d.setUTCDate(d.getUTCDate()+1)){

  dates.push(d.toISOString().slice(0,10));

}

const weeks = Math.ceil(dates.length/7);

let completed = new Set();

let currentUser = null;

let syncTimer = null;

let loading = false;

function message(text){

  document.getElementById("message").textContent=text;

}

function syncMessage(text){

  document.getElementById("syncStatus").textContent=text;

}

async function signUp(){

  const email=document.getElementById("email").value.trim();

  const password=document.getElementById("password").value;

  if(!email || password.length<6){

    message("Enter your email and a password of at least 6 characters.");

    return;

  }

  message("Creating your account...");

  const {data,error}=await db.auth.signUp({email,password});

  if(error){

    message(error.message);

    return;

  }

  if(data.session){

    message("Account created. Loading your tracker...");

  }else{

    message("Account created! Check your email for a confirmation link. Confirm it, then sign in here.");

  }

}

async function signIn(){

  const email=document.getElementById("email").value.trim();

  const password=document.getElementById("password").value;

  if(!email || !password){

    message("Enter your email and password.");

    return;

  }

  message("Signing in...");

  const {error}=await db.auth.signInWithPassword({email,password});

  if(error){

    message(error.message);

  }

}

async function signOut(){

  const {error}=await db.auth.signOut();

  if(error) alert(error.message);

}

function buildHeatmap(){

  const grid=document.getElementById("heatmap");

  const months=document.getElementById("months");

  const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  grid.innerHTML="";

  months.innerHTML="";

  ["Sun","Tue","Thu","Sat"].forEach((label,i)=>{

    const span=document.createElement("span");

    span.className="weekday";

    span.textContent=label;

    span.style.gridColumn="1";

    span.style.gridRow=String(i*2+1);

    grid.appendChild(span);

  });

  let shownMonths=new Set();

  dates.forEach(date=>{

    const d=new Date(date+"T00:00:00Z");

    const week=Math.floor((d.getTime()-start.getTime())/604800000);

    if(d.getUTCDate()<=7 || date===dates[0]){

      const key=d.getUTCMonth()+"-"+d.getUTCFullYear();

      if(!shownMonths.has(key)){

        shownMonths.add(key);

        const label=document.createElement("span");

        label.textContent=monthNames[d.getUTCMonth()];

        label.style.gridColumn=String(week+2);

        months.appendChild(label);

      }

    }

    const day=document.createElement("button");

    day.type="button";

    day.className="day"+(completed.has(date)?" done":"");

    day.title=date;

    day.setAttribute("aria-label",date+(completed.has(date)?" trained":" not trained"));

    day.style.gridColumn=String(week+2);

    day.style.gridRow=String(d.getUTCDay()+1);

    day.onclick=()=>toggleDay(date);

    grid.appendChild(day);

  });

  updateCount();

}

function updateCount(){

  const n=completed.size;

  const percent=Math.round(n/dates.length*100);

  document.getElementById("count").textContent=

    n+" workout"+(n===1?"":"s")+" · "+percent+"% of days";

}

async function loadCheckins(){

  if(!currentUser || loading) return;

  loading=true;

  syncMessage("Syncing...");

  const {data,error}=await db

    .from("gym_checkins")

    .select("workout_date")

    .eq("user_id",currentUser.id)

    .gte("workout_date",dates[0])

    .lte("workout_date",dates[dates.length-1]);

  loading=false;

  if(error){

    syncMessage("Sync error: "+error.message);

    return;

  }

  completed=new Set(data.map(row=>row.workout_date));

  buildHeatmap();

  syncMessage("Synced ✓");

}

async function toggleDay(date){

  if(!currentUser) return;

  syncMessage("Saving...");

  if(completed.has(date)){

    const {error}=await db

      .from("gym_checkins")

      .delete()

      .eq("user_id",currentUser.id)

      .eq("workout_date",date);

    if(error){

      syncMessage("Couldn't save: "+error.message);

      return;

    }

    completed.delete(date);

  }else{

    const {error}=await db

      .from("gym_checkins")

      .upsert(

        {user_id:currentUser.id,workout_date:date},

        {onConflict:"user_id,workout_date"}

      );

    if(error){

      syncMessage("Couldn't save: "+error.message);

      return;

    }

    completed.add(date);

  }

  buildHeatmap();

  syncMessage("Saved ✓");

}

function applySession(session){

  const user=session?.user || null;

  const nextId=user?.id || null;

  const oldId=currentUser?.id || null;

  currentUser=user;

  document.getElementById("auth").style.display=user?"none":"block";

  document.getElementById("tracker").style.display=user?"block":"none";

  if(nextId!==oldId){

    completed.clear();

    if(user){

      loadCheckins();

      if(syncTimer) clearInterval(syncTimer);

      syncTimer=setInterval(loadCheckins,15000);

    }else{

      if(syncTimer) clearInterval(syncTimer);

      syncTimer=null;

      buildHeatmap();

    }

  }

}

db.auth.onAuthStateChange((event,session)=>{

  setTimeout(()=>applySession(session),0);

});

window.addEventListener("focus",()=>{

  if(currentUser) loadCheckins();

});

document.addEventListener("visibilitychange",()=>{

  if(!document.hidden && currentUser) loadCheckins();

});

</script>

</body>

</html>
