.legend { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-top:14px; color:var(--muted); font-size:11px; }
.swatch { width:11px; height:11px; border-radius:3px; background:var(--empty); }
.swatch.done { background:var(--green); }
.hint { margin-top:14px; color:var(--muted); font-size:12px; }
